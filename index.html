// Pure Backgammon rules engine. White moves 24->1 (home 1-6), Black moves 1->24 (home 19-24).
// board b[1..24]: >0 white checkers, <0 black checkers.
const other = p => (p === 'w' ? 'b' : 'w');
const sg = p => (p === 'w' ? 1 : -1);
const dist = (p, i) => (p === 'w' ? i : 25 - i);
function initial() {

}
function canBearOff(s, p) {

  for (let i = 1; i <= 24; i++) if (s.b[i] * sg(p) > 0 && dist(p, i) > 6) return false;
  return true;
}
function stepMoves(s, p, die) {

    if (from === 'bar' || !canBearOff(s, p)) return null;
    const d = dist(p, from);
    if (die === d) return 'off';
    if (die > d) {
      for (let i = 1; i <= 24; i++) if (s.b[i] * g > 0 && dist(p, i) > d) return null;
      return 'off';
    }
    return null;
  };

}

function depth(s, p, rem) {

    if (1 + depth(apply(s, p, m), p, without(rem, d)) === max) res.push(m);

    const hi = Math.max(...rem);
    if (res.some(m => m.die === hi)) res = res.filter(m => m.die === hi);

  return res;
}

function board(s,flip,pv){let h=`<defs><linearGradient id="wd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a4a26"/><stop offset="1" stop-color="#5a2c14"/></linearGradient>
<filter id="gr"><feTurbulence type="fractalNoise" baseFrequency=".012 .35" numOctaves="3" seed="4"/><feColorMatrix values="0 0 0 0 .2 0 0 0 0 .1 0 0 0 0 .05 0 0 0 .35 0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
<linearGradient id="pl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8c796"/><stop offset="1" stop-color="#c99a62"/></linearGradient>
<radialGradient id="cw" cx=".35" cy=".3"><stop offset="0" stop-color="#fffdf3"/><stop offset=".7" stop-color="#e4d3a8"/><stop offset="1" stop-color="#a99466"/></radialGradient>
<radialGradient id="cb" cx=".35" cy=".3"><stop offset="0" stop-color="#6a5a50"/><stop offset=".6" stop-color="#2b2118"/><stop offset="1" stop-color="#0c0805"/></radialGradient></defs>
<rect x="10" y="10" width="980" height="620" rx="16" fill="url(#wd)"/><rect x="10" y="10" width="980" height="620" rx="16" filter="url(#gr)"/>
<rect x="40" y="30" width="410" height="580" fill="url(#pl)" stroke="#2a1608" stroke-width="3"/><rect x="500" y="30" width="410" height="580" fill="url(#pl)" stroke="#2a1608" stroke-width="3"/>
<rect x="450" y="30" width="50" height="580" fill="#5a2c14"/><rect x="915" y="30" width="60" height="285" fill="#6b1414"/><rect x="915" y="325" width="60" height="285" fill="#6b1414"/>`;
 const L=new Set((s.legal||[]).map(m=>m.from)),D=new Set(sel!=null?s.legal.filter(m=>m.from===sel).map(m=>m.to):[]);
 for(let pt=1;pt<=24;pt++){const{x,top}=geo(pt,flip),y0=top?30:610,y1=top?290:350,d=D.has(pt);
  h+=`<polygon data-p="${pt}" points="${x-PW/2+3},${y0} ${x+PW/2-3},${y0} ${x},${y1}" fill="${pt%2?'#8a3a24':'#2f1c10'}" ${d?'stroke="#7CFC9A" stroke-width="4"':''}/>`}
 const R=26;let ck='';
 for(let pt=1;pt<=24;pt++){const v=s.board[pt];if(!v)continue;const{x,top}=geo(pt,flip),n=Math.abs(v),w=v>0,step=n>5?(260-R)/(n-1):R*2;
  for(let i=0;i<n;i++){const y=cy(top,i,n);
   const hl=i===n-1&&L.has(pt)&&s.turn===s.you,on=sel===pt&&i===n-1;
   ck+=`<circle data-p="${pt}" data-tp="${i===n-1?1:0}" cx="${x}" cy="${y}" r="${R}" fill="url(#${w?'cw':'cb'})" stroke="${on?'#7CFC9A':hl?'#ffd34d':'#0006'}" stroke-width="${on||hl?4:1.5}"/>`}}
 for(const c of['w','b'])for(let i=0;i<s.bar[c];i++){const w=c==='w',y=w?400+i*54:240-i*54;ck+=`<circle data-p="bar" cx="475" cy="${y}" r="${R-2}" fill="url(#${w?'cw':'cb'})" stroke="${sel==='bar'||L.has('bar')?'#ffd34d':'#0006'}" stroke-width="3"/>`}
 for(const c of['w','b']){const bottom=(c==='w')!==flip;for(let i=0;i<s.off[c];i++){const y=bottom?600-i*18:40+i*18;ck+=`<rect x="925" y="${y-(bottom?12:0)}" width="40" height="12" rx="3" fill="url(#${c==='w'?'cw':'cb'})"/>`}}
 if(D.has('off'))h+=`<rect data-p="off" x="915" y="${flip?30:325}" width="60" height="285" fill="#7CFC9A" opacity=".3"/>`;
 $('bd').innerHTML=h+ck;if(pv)anim(pv,s,flip)}
$('bd').addEventListener('click',e=>{const p=e.target.dataset&&e.target.dataset.p;if(!p||!st||st.turn!==st.you)return;const k=p==='bar'||p==='off'?p:+p;
 const mv=sel!=null&&st.legal.find(m=>m.from===sel&&m.to===k);
 if(mv){S.emit('move',{from:mv.from,to:mv.to,die:mv.die});sel=null;return}
 const from=st.legal.filter(m=>m.from===k);if(from.length)sel=k;else sel=null;draw()});
const cy=(top,i,n)=>{const s=Math.min(n>5?234/(n-1):52,52);return top?56+i*s:584-i*s};
function anim(pv,s,flip){if(!pv.board)return;const cnt=(X,c,pt)=>{const v=X.board[pt]*(c==='w'?1:-1);return v>0?v:0};
 for(const c of['w','b']){const inc=[],dec=[];for(let pt=1;pt<=24;pt++){const a=cnt(pv,c,pt),b=cnt(s,c,pt);if(b>a)inc.push(pt);else if(b<a)dec.push(pt)}
  if(inc.length!==1||cnt(s,c,inc[0])-cnt(pv,c,inc[0])!==1)continue;
  const dst=inc[0],n=cnt(s,c,dst),g=geo(dst,flip);let sx,sy;
  if(dec.length===1){const sp=dec[0],g2=geo(sp,flip),k=cnt(pv,c,sp);sx=g2.x;sy=cy(g2.top,k-1,k)}
  else if(pv.bar[c]>s.bar[c]){sx=475;sy=c==='w'?400:240}else continue;
  const el=document.querySelector(`circle[data-p="${dst}"][data-tp="1"]`);if(!el)continue;
  el.animate([{transform:`translate(${sx-g.x}px,${sy-cy(g.top,n-1,n)}px)`},{transform:'translate(0,0)'}],{duration:380,easing:'cubic-bezier(.2,.8,.3,1)'})}}
const av=n=>{let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))%360;return`<span class="av" style="background:hsl(${h},55%,42%)">${esc([...n][0]||'?').toUpperCase()}</span>`};
function record(s){const o=s.players[s.you==='w'?'b':'w'],h=JSON.parse(localStorage.hist||'[]');h.unshift({t:Date.now(),o:o?o.name:'?',r:s.winner==='draw'?'d':s.winner===s.you?'w':'l',d:s.elapsed});localStorage.hist=JSON.stringify(h.slice(0,30));showHist()}
function showHist(){const h=JSON.parse(localStorage.hist||'[]'),w=h.filter(x=>x.r==='w').length;
 $('hist').innerHTML=h.length?`<b>${T('recent')}</b> — ${h.length} ${T('games')} · ${w} ${T('wins')}<br>`+h.slice(0,5).map(x=>`${x.r==='w'?'🏆':x.r==='l'?'❌':'🤝'} ${esc(x.o)} · ${new Date(x.t).toLocaleDateString()} · ${fmt(x.d)}`).join('<br>'):''}
function applyLang(){document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';
 const m={create:'create',join:'join',inv:'invite',rollb:'roll',res:'resign',drw:'draw'};for(const i in m)$(i).textContent=T(m[i]);
 $('name').placeholder=T('name');$('code').placeholder=T('code');
 const v=$('tc').value||'5';$('tc').innerHTML=[1,3,5,10].map(n=>`<option value="${n}">${n} ${T('min')}</option>`).join('')+`<option value="0">${T('unl')}</option>`;$('tc').value=v;
 document.querySelectorAll('.tg-lang').forEach(b=>b.textContent=lang==='fa'?'English':'فارسی');showHist();st&&draw(0,1)}
document.querySelectorAll('.tg-lang').forEach(b=>b.onclick=()=>{lang=lang==='fa'?'en':'fa';localStorage.lang=lang;applyLang()});
document.querySelectorAll('.tg-thm').forEach(b=>b.onclick=()=>{document.body.classList.toggle('light');localStorage.thm=document.body.classList.contains('light')?1:''});
if(localStorage.thm)document.body.classList.add('light');
$('fs').onclick=()=>{const e=document.documentElement;document.fullscreenElement?document.exitFullscreen():e.requestFullscreen&&e.requestFullscreen()};
$('vol').oninput=e=>vol=e.target.value/100;
document.addEventListener('click',e=>{if(e.target.tagName==='BUTTON')snd('click')});
applyLang();if(localStorage.role==='host'&&localStorage.G)resume();
</script></body></html>
