<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Backgammon</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at 20% 20%, #4a5870 0%, #1b2538 45%, #0a0f1a 100%);
      font-family: system-ui, sans-serif; color: #e8edf5;
    }
    #stage {
      position: fixed; inset: 0; box-sizing: border-box;
      display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #board {
      height: 92%; max-width: 68vw; aspect-ratio: 1154 / 716;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .55));
    }
    #rotate {
      position: fixed; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      text-align: center; padding: 24px;
    }
    #phone {
      width: 44px; height: 76px; border: 4px solid #f0c17c; border-radius: 10px;
      animation: turn 2.2s ease-in-out infinite;
    }
    @keyframes turn {
      0%, 25% { transform: rotate(0deg); }
      60%, 100% { transform: rotate(-90deg); }
    }
    @media (orientation: portrait) {
      #stage { display: none; }
      #rotate { display: flex; }
    }
  </style>
</head>
<body>
  <div id="rotate">
    <div id="phone"></div>
    <div style="font-size:20px;font-weight:600">Please rotate your phone</div>
    <div style="opacity:.7">Backgammon is played in landscape mode</div>
  </div>

  <div id="stage">
    <svg id="board" viewBox="0 0 1154 716" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>

  <script>
    // Telegram setup
    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.disableVerticalSwipes(); } catch (e) {}
    }
    try { screen.orientation.lock("landscape").catch(function () {}); } catch (e) {}

    // Board drawing
    var X0 = 82, PW = 77.5, BAR = 60, TOP = 10, BOT = 708, LEN = 300;
    var s = "";
    s += '<defs>' +
      '<linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="#b5603a"/><stop offset="1" stop-color="#6e3520"/></linearGradient>' +
      '<linearGradient id="tray" x1="0" y1="0" x2="1" y2="0">' +
        '<stop offset="0" stop-color="#8a4528"/><stop offset=".5" stop-color="#b0623a"/>' +
        '<stop offset="1" stop-color="#8a4528"/></linearGradient>' +
      '<linearGradient id="maple" x1="0" y1="0" x2="1" y2="0">' +
        '<stop offset="0" stop-color="#eeb96f"/><stop offset=".5" stop-color="#f8d598"/>' +
        '<stop offset="1" stop-color="#eeb96f"/></linearGradient>' +
      '<radialGradient id="vignette" cx=".5" cy=".5" r=".75">' +
        '<stop offset=".6" stop-color="#d2641e" stop-opacity="0"/>' +
        '<stop offset="1" stop-color="#d2641e" stop-opacity=".45"/></radialGradient>' +
      '<filter id="grain" x="0" y="0" width="100%" height="100%">' +
        '<feTurbulence type="fractalNoise" baseFrequency="0.01 0.22" numOctaves="3" seed="7"/>' +
        '<feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.22  0 0 0 0 0.07  0.55 0 0 0 -0.1"/>' +
      '</filter></defs>';

    // Frame, trays, playing surface, center bar
    s += '<rect width="1154" height="716" rx="22" fill="url(#wood)"/>';
    s += '<rect x="10" y="10" width="62" height="698" fill="url(#tray)"/>';
    s += '<rect x="1082" y="10" width="62" height="698" fill="url(#tray)"/>';
    s += '<rect x="76" y="10" width="1002" height="698" fill="url(#maple)"/>';
    s += '<rect x="76" y="10" width="1002" height="698" filter="url(#grain)" opacity=".7"/>';
    s += '<rect x="547" y="10" width="60" height="698" fill="url(#tray)"/>';

    // 24 points
    function triangle(x, isTop, isCrimson) {
      var y = isTop ? TOP : BOT;
      var tip = isTop ? TOP + LEN : BOT - LEN;
      varinner = isTop ? tip - 22 : tip + 22;
      var fill = isCrimson ? "#8c1f2e" : "#f2a65a";
      var line = isCrimson ? "#d9a441" : "#dc8a3a";
      return '<path d="M' + x + ' ' + y + ' L' + (x + PW) + ' ' + y + ' L' + (x + PW / 2) + ' ' + tip +
             ' Z" fill="' + fill + '"/>' +
             '<path d="M' + (x + 10) + ' ' + y + ' L' + (x + PW - 10) + ' ' + y + ' L' + (x + PW / 2) + ' ' + inner +
             ' Z" fill="none" stroke="' + line + '" stroke-width="2"/>';
    }
    for (var half = 0; half < 2; half++) {
      for (var i = 0; i < 6; i++) {
        var x = X0 + half  (6  PW + BAR) + i * PW;
        var topCrimson = (i % 2 === 0);
        s += triangle(x, true, topCrimson);
        s += triangle(x, false, !topCrimson);
      }
    }

    // Edge glow
    s += '<rect x="76" y="10" width="1002" height="698" fill="url(#vignette)"/>';

    document.getElementById("board").innerHTML = s;
  </script>
</body>
</html>
